name: Run Pytest Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: Run Pytest
        env:
          PYTHONPATH: src
        run: python -m pytest -v
"@ | Set-Content -Path .github/workflows/tests.yml -Encoding UTF8

git add pyproject.toml .github/workflows/tests.yml
git commit -m "Add pandas dependency and update CI workflow"
git push
